[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-memory-mcp"
version = "0.1.0"
description = "Local, concise task memory for coding agents"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
lean-memory = "lean_memory.server:main"

[tool.setuptools.packages.find]
where = ["src"]
